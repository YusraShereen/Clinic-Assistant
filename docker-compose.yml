services:
  assistant:
    build: .
    image: clinic-assistant:local
    ports: ["8000:8000"]
    volumes: ["./models:/models:ro"]     # put the trained model at ./models/nlu
    environment:
      EMBEDDER: e5
      INTENT_THRESHOLD: "0.55"           # choose from scripts/pick_threshold.py
      RETRIEVAL_MIN_SCORE: "0.0"         # raw e5 scores do not separate answerable/unanswerable (see README)
      RETRIEVAL_MIN_MARGIN: "0.018"      # chosen on the DEV set (scripts/eval_rag.py); refuse if top-2 gap is smaller
      CLINIC_PHONE: "021-000-0000"
      LOG_TEXT: "0"
